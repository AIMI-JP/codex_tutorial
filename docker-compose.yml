services:
  node-setup:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    working_dir: /workspace
    command: >
      bash -lc "npm --prefix apps/web ci && npm --prefix apps/windows ci"
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
      - windows_node_modules:/workspace/apps/windows/node_modules

  web-dev:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    working_dir: /workspace
    command: npm --prefix apps/web run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
      - windows_node_modules:/workspace/apps/windows/node_modules

  node-check:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1000"
    working_dir: /workspace
    command: bash
    volumes:
      - ./:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
      - windows_node_modules:/workspace/apps/windows/node_modules

  rust-check:
    build:
      context: .
      dockerfile: Dockerfile.rust
    working_dir: /workspace/apps/windows/src-tauri
    command: bash
    volumes:
      - ./:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - tauri_target:/workspace/apps/windows/src-tauri/target

volumes:
  web_node_modules:
  windows_node_modules:
  cargo_registry:
  cargo_git:
  tauri_target:
